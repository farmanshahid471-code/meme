# Fast verification workflow for feature branches (Arena).
#
# The upstream `ci.yml` only runs on `main`, which means feature branches never
# get compiled. This workflow makes every push to a feature branch compile the
# backend and run the unit tests, so breakage is caught in minutes.
name: Verify

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches: ['**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-verify-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-verify-

      # Compiler output is echoed back as check-run annotations: raw job logs
      # live on Azure Blob, which restricted networks (e.g. an agent sandbox)
      # cannot download, but annotations are readable through the REST API.
      - name: cargo check (all targets)
        run: |
          set +e
          cargo check --all-targets --locked 2>&1 | tee /tmp/cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo check failed (exit $status) — digest below"
            grep -aE "^error(\[|:)|^warning: unused|--> |cannot find|expected|help: " /tmp/cargo-check.log \
              | head -60 \
              | while IFS= read -r line; do
                  clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                  echo "::error::${clean}"
                done
            exit "$status"
          fi

      # Test output is echoed back as check-run annotations: raw job logs live on
      # Azure Blob, which some restricted networks (e.g. an agent sandbox) cannot
      # download, but annotations are readable through the REST API.
      - name: cargo test
        run: |
          set +e
          cargo test --locked --no-fail-fast 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test failed (exit $status) — digest below"
            grep -aE "error(\[|:)|panicked at|assertion|test result:|^failures:|^---- |left:|right:|No space left|Killed|ld returned|cannot find" /tmp/cargo-test.log \
              | tail -40 \
              | while IFS= read -r line; do
                  clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                  echo "::error::${clean}"
                done
            exit "$status"
          fi
        env:
          # Config::load() requires these; tests must not hit the real network.
          SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
          HELIUS_API_KEY: test_key
          WALLET_PRIVATE_KEY: 11111111111111111111111111111111
        continue-on-error: false
